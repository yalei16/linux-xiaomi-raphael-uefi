name: Build Kali Live Boot for Raphael

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEB_URL_BASE: "https://github.com/yalei16/linux-xiaomi-raphael-uefi/releases/download/kernel-v6.18"
  BUILD_DIR: ${{ github.workspace }}/build
  OUTPUT_DIR: ${{ github.workspace }}/output

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support debootstrap abootimg device-tree-compiler gcc-aarch64-linux-gnu cpio gzip wget file

    - name: Download kernel packages
      run: |
        mkdir -p ${{ env.BUILD_DIR }}/debs
        cd ${{ env.BUILD_DIR }}/debs
        wget -q "${{ env.DEB_URL_BASE }}/linux-image-xiaomi-raphael.deb"
        wget -q "${{ env.DEB_URL_BASE }}/linux-headers-xiaomi-raphael.deb"
        wget -q "${{ env.DEB_URL_BASE }}/firmware-xiaomi-raphael.deb"
        wget -q "${{ env.DEB_URL_BASE }}/alsa-xiaomi-raphael.deb"
        ls -lh *.deb

    - name: Extract kernel
      run: |
        mkdir -p ${{ env.BUILD_DIR }}/extract
        for deb in ${{ env.BUILD_DIR }}/debs/*.deb; do dpkg-deb -x "$deb" ${{ env.BUILD_DIR }}/extract/; done
        KERNEL=$(find ${{ env.BUILD_DIR }}/extract -name "vmlinuz*" -type f | head -1)
        echo "KERNEL_PATH=$KERNEL" >> $GITHUB_ENV
        echo "Found kernel: $KERNEL"

    - name: Build rootfs
      run: |
        sudo mkdir -p ${{ env.BUILD_DIR }}/rootfs
        sudo debootstrap --foreign --variant=minbase --arch=arm64 kali-rolling ${{ env.BUILD_DIR }}/rootfs http://http.kali.org/kali
        sudo cp /usr/bin/qemu-aarch64-static ${{ env.BUILD_DIR }}/rootfs/usr/bin/

    - name: Configure rootfs
      run: |
        sudo mount --bind /dev ${{ env.BUILD_DIR }}/rootfs/dev
        sudo mount --bind /proc ${{ env.BUILD_DIR }}/rootfs/proc
        sudo mount --bind /sys ${{ env.BUILD_DIR }}/rootfs/sys
        sudo chroot ${{ env.BUILD_DIR }}/rootfs /debootstrap/debootstrap --second-stage
        sudo tee ${{ env.BUILD_DIR }}/rootfs/tmp/setup.sh > /dev/null << 'EOFSCRIPT'
        #!/bin/bash
        set -e
        echo "root:toor" | chpasswd
        apt-get update
        apt-get install -y --no-install-recommends busybox-static dropbear-bin wireless-tools wpasupplicant iproute2 iputils-ping net-tools kmod udev
        mkdir -p /etc/dropbear
        dropbearkey -t rsa -f /etc/dropbear/dropbear_rsa_host_key
        dropbearkey -t ecdsa -f /etc/dropbear/dropbear_ecdsa_host_key
        cat > /init << 'EOFINIT'
        #!/bin/sh
        echo "[*] Kali Live Boot for Redmi K20 Pro"
        mount -t proc proc /proc
        mount -t sysfs sys /sys
        mount -t devtmpfs dev /dev
        mount -t tmpfs tmp /tmp
        echo /sbin/mdev > /proc/sys/kernel/hotplug
        mdev -s
        ifconfig lo 127.0.0.1 up
        /usr/sbin/dropbear -p 22
        mkdir -p /data
        mount /dev/block/bootdevice/by-name/userdata /data 2>/dev/null || echo "[!] RAM mode"
        echo "[+] Ready. Login: root/toor"
        exec /bin/sh
        EOFINIT
        chmod +x /init
        /bin/busybox --install -s /bin/
        rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/* /tmp/* /var/tmp/*
        apt-get clean
        EOFSCRIPT
        sudo chmod +x ${{ env.BUILD_DIR }}/rootfs/tmp/setup.sh
        sudo chroot ${{ env.BUILD_DIR }}/rootfs /tmp/setup.sh
        if [ -d "${{ env.BUILD_DIR }}/extract/lib/firmware" ]; then sudo cp -r ${{ env.BUILD_DIR }}/extract/lib/firmware/* ${{ env.BUILD_DIR }}/rootfs/lib/firmware/ 2>/dev/null || true; fi
        sudo umount -l ${{ env.BUILD_DIR }}/rootfs/dev || true
        sudo umount -l ${{ env.BUILD_DIR }}/rootfs/proc || true
        sudo umount -l ${{ env.BUILD_DIR }}/rootfs/sys || true

    - name: Create initramfs
      run: |
        cd ${{ env.BUILD_DIR }}/rootfs
        sudo sh -c 'find . -print0 | cpio --null --create --format=newc > "${{ env.BUILD_DIR }}/initramfs.cpio"'
        gzip -9 ${{ env.BUILD_DIR }}/initramfs.cpio
        mv ${{ env.BUILD_DIR }}/initramfs.cpio.gz ${{ env.BUILD_DIR }}/initramfs.gz
        ls -lh ${{ env.BUILD_DIR }}/initramfs.gz

    - name: Build boot.img
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        KERNEL="${{ env.KERNEL_PATH }}"
        INITRAMFS="${{ env.BUILD_DIR }}/initramfs.gz"
        OUTPUT="${{ env.OUTPUT_DIR }}/kali-raphael-live.img"
        CMDLINE="console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 androidboot.usbcontroller=a600000.dwc3 buildvariant=userdebug init=/init rw"
        abootimg --create "$OUTPUT" -k "$KERNEL" -r "$INITRAMFS" -c "pagesize = 4096" -c "kerneladdr = 0x00008000" -c "ramdiskaddr = 0x01000000" -c "secondaddr = 0x00f00000" -c "tagsaddr = 0x00000100" -c "cmdline = ${CMDLINE}"
        ls -lh "$OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kali-raphael-boot
        path: ${{ env.OUTPUT_DIR }}/kali-raphael-live.img
